name: Release Check

# Runs the same packaging steps release.yml relies on. Called from test.yml's
# ci-success gate on every push and PR, so a broken package is caught before
# merge instead of after the tag has already gone out.

on:
  workflow_call:

jobs:
  dry-run-publish:
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v6

      - name: 🛠️ Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 20.x

      - name: 📦 Install dependencies
        run: npm ci

      - name: 🔨 Dry-run publish
        run: npm run dry-run-publish

      - name: 📦 Package extension
        # Pinned to match the major version HaaLeo/publish-vscode-extension@v1
        # (used by release.yml) bundles, so this check packages the same way
        # production actually will.
        run: npx @vscode/vsce@^2.32.0 package
