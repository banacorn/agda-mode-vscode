name: Release

# Three ways in:
#   1. The Test workflow finishing successfully on master - tags the exact
#      commit it validated, then deploys. Waiting on Test's completion (rather
#      than triggering directly off the same push) is what stops a release
#      from publishing a commit whose CI is still running or red.
#   2. A push of a v* tag (e.g. pushed by hand) - deploys directly, tagging
#      skipped since the tag already exists. This is also the escape hatch
#      for re-running a deploy without touching package.json again.
#   3. A manual workflow_dispatch naming an existing vX.Y.Z tag - deploys
#      directly like (2), plus an optional dry-run mode that packages and
#      validates without publishing to either registry. This is the
#      controlled recovery path for completing (or rehearsing) a release
#      without pushing a tag by hand.
#
# All paths converge on one job so the tag push never has to trigger a second
# workflow run - avoiding the GITHUB_TOKEN anti-recursion restriction that a
# separate tag-triggered workflow would hit.

on:
  workflow_run:
    workflows: [ "Test" ]
    types: [ completed ]
    branches: [ master ]
  push:
    tags: [ 'v*' ]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing vX.Y.Z tag to deploy'
        required: true
        type: string
      dry_run:
        description: 'Package and validate without publishing to either registry'
        required: false
        type: boolean
        default: true

# Serialize releases: an overlapping master push and manual tag push (or two
# close master pushes) must not publish concurrently. Never cancel an
# in-progress release - it may have already tagged or partially published.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  tag:
    if: >-
      github.event_name == 'workflow_run' &&
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    outputs:
      should_deploy: ${{ steps.decide.outputs.should_deploy }}
    steps:
      - name: 📥 Checkout the exact commit Test just validated
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0

      - name: 🔍 Check whether the version changed, and tag it if so
        id: decide
        run: |
          CURRENT=$(node -p "require('./package.json').version")

          if ! node .github/scripts/version-utils.js is-valid-version "$CURRENT"; then
            echo "package.json version '$CURRENT' is not a valid X.Y.Z semver" >&2
            exit 1
          fi

          # Compared against the latest existing release tag rather than the
          # previous commit: workflow_run carries no "before" SHA to diff against.
          LATEST_TAG=$(git tag --list 'v*' | sed 's/^v//' | sort -V | tail -1)

          if [ -z "$LATEST_TAG" ]; then
            echo "No existing vX.Y.Z tag found, treating $CURRENT as the first release"
          elif [ "$CURRENT" = "$LATEST_TAG" ]; then
            echo "should_deploy=false" >> "$GITHUB_OUTPUT"
            exit 0
          else
            node .github/scripts/version-utils.js is-increase "$CURRENT" "$LATEST_TAG"
          fi

          TAG="v$CURRENT"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          EXISTING=$(git ls-remote origin "refs/tags/$TAG" | cut -f1)
          if [ -n "$EXISTING" ]; then
            if [ "$EXISTING" = "$(git rev-parse HEAD)" ]; then
              echo "Tag $TAG already points at this commit, treating as a retry"
            else
              echo "Tag $TAG already exists and points at a different commit ($EXISTING)" >&2
              exit 1
            fi
          else
            git tag "$TAG"
            git push origin "$TAG"
          fi
          echo "should_deploy=true" >> "$GITHUB_OUTPUT"

  deploy:
    needs: tag
    if: >-
      !cancelled() &&
      (github.event_name == 'workflow_dispatch' ||
       github.ref_type == 'tag' ||
       (needs.tag.result == 'success' && needs.tag.outputs.should_deploy == 'true'))
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: 🔍 Validate the requested tag exists
        # Runs before checkout so a bad input fails with a clear message
        # instead of an opaque "couldn't find remote ref" from checkout.
        if: github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${{ inputs.tag }}"
          SEMVER_TAG_REGEX='^v[0-9]+\.[0-9]+\.[0-9]+$'
          if ! [[ "$TAG" =~ $SEMVER_TAG_REGEX ]]; then
            echo "Tag '$TAG' is not a valid vX.Y.Z tag" >&2
            exit 1
          fi
          if ! gh api "repos/${{ github.repository }}/git/refs/tags/$TAG" >/dev/null 2>&1; then
            echo "Tag '$TAG' does not exist in this repository" >&2
            exit 1
          fi

      - name: 📥 Checkout code
        uses: actions/checkout@v6
        with:
          # workflow_run's default github.sha is the workflow file's ref, not
          # the commit it validated - pin explicitly to that commit instead.
          # workflow_dispatch carries no ref of its own here, so pin to the
          # tag the operator named.
          ref: >-
            ${{ github.event_name == 'workflow_dispatch' && inputs.tag ||
                github.event_name == 'workflow_run' && github.event.workflow_run.head_sha ||
                github.sha }}

      - name: 🔍 Validate the requested tag matches package.json's version
        if: github.ref_type == 'tag' || github.event_name == 'workflow_dispatch'
        run: |
          VERSION=$(node -p "require('./package.json').version")
          EXPECTED_TAG="${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}"
          if ! node .github/scripts/version-utils.js tag-matches-version "$EXPECTED_TAG" "$VERSION"; then
            echo "Tag $EXPECTED_TAG does not match package.json version $VERSION" >&2
            exit 1
          fi

      - name: 🛠️ Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24.x

      - name: 📦 Install dependencies
        run: npm ci

      - name: 🔨 Build stuff
        run: npm run dry-run-publish

      - name: Extract version info
        id: version
        run: |
          VERSION=$(node -p "require('./package.json').version")
          MINOR_VERSION=$(echo $VERSION | cut -d. -f2)
          IS_PRERELEASE=$((MINOR_VERSION % 2))
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "minor=$MINOR_VERSION" >> $GITHUB_OUTPUT
          echo "is_prerelease=$IS_PRERELEASE" >> $GITHUB_OUTPUT
          echo "Publishing version $VERSION (minor: $MINOR_VERSION, prerelease: $IS_PRERELEASE)"

      - name: 📦 Package extension
        # Pinned to the same @vscode/vsce range used to publish below, so
        # this packages the same way release-check.yml verified. Packaged
        # once, up front, so both registries publish the identical artifact
        # instead of each step packaging its own.
        run: npx @vscode/vsce@^2.32.0 package --out extension.vsix

      - name: 🔒 Compute the vsix's SHA-256 digest
        run: sha256sum extension.vsix > extension.vsix.sha256

      - name: 📤 Upload the vsix and its digest
        uses: actions/upload-artifact@v4
        with:
          name: extension-${{ steps.version.outputs.version }}
          path: |
            extension.vsix
            extension.vsix.sha256
          retention-days: 90

      - name: 🔎 Check whether Open VSX already has this version
        # Makes a retry after a partial deployment idempotent: republishing
        # an existing version to Open VSX fails, so detect it up front and
        # treat it as already satisfied instead of a broken retry.
        id: openvsx_check
        run: |
          VERSION=$(node -p "require('./package.json').version")
          STATUS=$(curl -s -o /dev/null -w '%{http_code}' "https://open-vsx.org/api/banacorn/agda-mode/$VERSION")
          if [ "$STATUS" = "200" ]; then
            echo "Open VSX already has version $VERSION, publish step will be skipped"
            echo "already_published=true" >> "$GITHUB_OUTPUT"
          else
            echo "already_published=false" >> "$GITHUB_OUTPUT"
          fi

      - name: 🚀 Publish to Open VSX Registry
        id: openvsx
        if: >-
          (github.event_name != 'workflow_dispatch' || inputs.dry_run == false) &&
          steps.openvsx_check.outputs.already_published != 'true'
        # Publishes the already-packaged vsix directly via the ovsx CLI,
        # instead of a third-party action, so this runs on our own pinned
        # Node 24 toolchain rather than that action's bundled Node 20 runtime.
        env:
          OVSX_PAT: ${{ secrets.OPEN_VSX }}
        run: npx ovsx@^0.9.0 publish extension.vsix --pat "$OVSX_PAT"
        continue-on-error: true

      - name: 🔎 Check whether the Marketplace already has this version
        # Same idempotency guard as the Open VSX check above, queried
        # through the Marketplace gallery API instead of a version-scoped URL.
        id: marketplace_check
        run: |
          VERSION=$(node -p "require('./package.json').version")
          HAS_VERSION=$(curl -s -X POST https://marketplace.visualstudio.com/_apis/public/gallery/extensionquery \
            -H "Content-Type: application/json" \
            -H "Accept: application/json;api-version=3.0-preview.1" \
            -d '{"filters":[{"criteria":[{"filterType":7,"value":"banacorn.agda-mode"}]}],"flags":103}' \
            | VERSION="$VERSION" node -e "
                let d = '';
                process.stdin.on('data', c => d += c);
                process.stdin.on('end', () => {
                  let versions = [];
                  try { versions = JSON.parse(d).results[0].extensions[0].versions; } catch { versions = []; }
                  console.log(versions.some(v => v.version === process.env.VERSION));
                });
              ")
          if [ "$HAS_VERSION" = "true" ]; then
            echo "Marketplace already has version $VERSION, publish step will be skipped"
            echo "already_published=true" >> "$GITHUB_OUTPUT"
          else
            echo "already_published=false" >> "$GITHUB_OUTPUT"
          fi

      - name: 🚀 Publish to Visual Studio Marketplace
        id: marketplace
        if: >-
          (github.event_name != 'workflow_dispatch' || inputs.dry_run == false) &&
          steps.marketplace_check.outputs.already_published != 'true'
        # Same rationale as the Open VSX step above: publish the
        # already-packaged vsix directly via the vsce CLI, on our own
        # pinned Node 24 toolchain instead of that action's Node 20 runtime.
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
        run: |
          ARGS=(--packagePath extension.vsix --pat "$VSCE_PAT")
          if [ "${{ steps.version.outputs.is_prerelease }}" = "1" ]; then
            ARGS+=(--pre-release)
          fi
          npx @vscode/vsce@^2.32.0 publish "${ARGS[@]}"
        continue-on-error: true

      - name: 🧪 Dry run complete - registries were not published to
        if: github.event_name == 'workflow_dispatch' && inputs.dry_run == true
        run: echo "Dry run of ${{ inputs.tag }} succeeded - packaged and validated, both registry publishes were skipped."

      - name: ✅ Require both registries to have succeeded
        # Each publish step continues past the other's failure so both
        # registries always get an attempt - this is what turns a partial
        # deployment back into a failed job instead of a silent green one.
        # A registry already holding this version (publish step skipped by
        # the idempotency check above) counts as satisfied, not failed.
        if: always() && (github.event_name != 'workflow_dispatch' || inputs.dry_run == false)
        run: |
          OPENVSX_OK="${{ steps.openvsx.outcome == 'success' || steps.openvsx_check.outputs.already_published == 'true' }}"
          MARKETPLACE_OK="${{ steps.marketplace.outcome == 'success' || steps.marketplace_check.outputs.already_published == 'true' }}"
          if [ "$OPENVSX_OK" != "true" ] || [ "$MARKETPLACE_OK" != "true" ]; then
            echo "Open VSX: ${{ steps.openvsx.outcome }} (already published: ${{ steps.openvsx_check.outputs.already_published }})" >&2
            echo "Marketplace: ${{ steps.marketplace.outcome }} (already published: ${{ steps.marketplace_check.outputs.already_published }})" >&2
            exit 1
          fi
