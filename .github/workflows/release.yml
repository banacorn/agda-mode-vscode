name: Release

# Two ways in:
#   1. The Test workflow finishing successfully on master - tags the exact
#      commit it validated, then deploys. Waiting on Test's completion (rather
#      than triggering directly off the same push) is what stops a release
#      from publishing a commit whose CI is still running or red.
#   2. A push of a v* tag (e.g. pushed by hand) - deploys directly, tagging
#      skipped since the tag already exists. This is also the escape hatch
#      for re-running a deploy without touching package.json again.
#
# Both paths converge on one job so the tag push never has to trigger a second
# workflow run - avoiding the GITHUB_TOKEN anti-recursion restriction that a
# separate tag-triggered workflow would hit.

on:
  workflow_run:
    workflows: [ "Test" ]
    types: [ completed ]
    branches: [ master ]
  push:
    tags: [ 'v*' ]

# Serialize releases: an overlapping master push and manual tag push (or two
# close master pushes) must not publish concurrently. Never cancel an
# in-progress release - it may have already tagged or partially published.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  tag:
    if: >-
      github.event_name == 'workflow_run' &&
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    outputs:
      should_deploy: ${{ steps.decide.outputs.should_deploy }}
    steps:
      - name: 📥 Checkout the exact commit Test just validated
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0

      - name: 🔍 Check whether the version changed, and tag it if so
        id: decide
        run: |
          CURRENT=$(node -p "require('./package.json').version")

          SEMVER_REGEX='^[0-9]+\.[0-9]+\.[0-9]+$'
          if ! [[ "$CURRENT" =~ $SEMVER_REGEX ]]; then
            echo "package.json version '$CURRENT' is not a valid X.Y.Z semver" >&2
            exit 1
          fi

          # Compared against the latest existing release tag rather than the
          # previous commit: workflow_run carries no "before" SHA to diff against.
          LATEST_TAG=$(git tag --list 'v*' | sed 's/^v//' | sort -V | tail -1)

          if [ -z "$LATEST_TAG" ]; then
            echo "No existing vX.Y.Z tag found, treating $CURRENT as the first release"
          elif [ "$CURRENT" = "$LATEST_TAG" ]; then
            echo "should_deploy=false" >> "$GITHUB_OUTPUT"
            exit 0
          else
            if ! [[ "$LATEST_TAG" =~ $SEMVER_REGEX ]]; then
              echo "latest tag version '$LATEST_TAG' is not a valid X.Y.Z semver, cannot compare" >&2
              exit 1
            fi
            node -e "
              const [c, p] = process.argv.slice(1).map(v => v.split('.').map(Number));
              for (let i = 0; i < 3; i++) {
                if (c[i] > p[i]) process.exit(0);
                if (c[i] < p[i]) process.exit(1);
              }
              process.exit(1);
            " "$CURRENT" "$LATEST_TAG" || { echo "package.json version went from $LATEST_TAG to $CURRENT, which is not an increase" >&2; exit 1; }
          fi

          TAG="v$CURRENT"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          EXISTING=$(git ls-remote origin "refs/tags/$TAG" | cut -f1)
          if [ -n "$EXISTING" ]; then
            if [ "$EXISTING" = "$(git rev-parse HEAD)" ]; then
              echo "Tag $TAG already points at this commit, treating as a retry"
            else
              echo "Tag $TAG already exists and points at a different commit ($EXISTING)" >&2
              exit 1
            fi
          else
            git tag "$TAG"
            git push origin "$TAG"
          fi
          echo "should_deploy=true" >> "$GITHUB_OUTPUT"

  deploy:
    needs: tag
    if: >-
      !cancelled() &&
      (github.ref_type == 'tag' ||
       (needs.tag.result == 'success' && needs.tag.outputs.should_deploy == 'true'))
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v6
        with:
          # workflow_run's default github.sha is the workflow file's ref, not
          # the commit it validated - pin explicitly to that commit instead.
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}

      - name: 🔍 Validate the pushed tag matches package.json's version
        if: github.ref_type == 'tag'
        run: |
          VERSION=$(node -p "require('./package.json').version")
          if [ "${GITHUB_REF_NAME}" != "v$VERSION" ]; then
            echo "Tag ${GITHUB_REF_NAME} does not match package.json version $VERSION" >&2
            exit 1
          fi

      - name: 🛠️ Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 20.x

      - name: 📦 Install dependencies
        run: npm ci

      - name: 🔨 Build stuff
        run: npm run dry-run-publish

      - name: Extract version info
        id: version
        run: |
          VERSION=$(node -p "require('./package.json').version")
          MINOR_VERSION=$(echo $VERSION | cut -d. -f2)
          IS_PRERELEASE=$((MINOR_VERSION % 2))
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "minor=$MINOR_VERSION" >> $GITHUB_OUTPUT
          echo "is_prerelease=$IS_PRERELEASE" >> $GITHUB_OUTPUT
          echo "Publishing version $VERSION (minor: $MINOR_VERSION, prerelease: $IS_PRERELEASE)"

      - name: 📦 Package extension
        # Pinned to match the major version HaaLeo/publish-vscode-extension@v1
        # bundles, so this packages the same way release-check.yml verified.
        # Packaged once, up front, so both registries publish the identical
        # artifact instead of each step packaging its own.
        run: npx @vscode/vsce@^2.32.0 package --out extension.vsix

      - name: 🔒 Compute the vsix's SHA-256 digest
        run: sha256sum extension.vsix > extension.vsix.sha256

      - name: 📤 Upload the vsix and its digest
        uses: actions/upload-artifact@v4
        with:
          name: extension-${{ steps.version.outputs.version }}
          path: |
            extension.vsix
            extension.vsix.sha256
          retention-days: 90

      - name: 🚀 Publish to Open VSX Registry
        id: openvsx
        uses: HaaLeo/publish-vscode-extension@f4ece70f329f66686bd71c54b1671353fe320e49 # v1
        with:
          pat: ${{ secrets.OPEN_VSX }}
          extensionFile: extension.vsix
        continue-on-error: true

      - name: 🚀 Publish to Visual Studio Marketplace
        id: marketplace
        uses: HaaLeo/publish-vscode-extension@f4ece70f329f66686bd71c54b1671353fe320e49 # v1
        with:
          pat: ${{ secrets.VSCE_PAT }}
          registryUrl: https://marketplace.visualstudio.com
          preRelease: ${{ steps.version.outputs.is_prerelease == '1' }}
          extensionFile: extension.vsix
        continue-on-error: true

      - name: ✅ Require both registries to have succeeded
        # Each publish step continues past the other's failure so both
        # registries always get an attempt - this is what turns a partial
        # deployment back into a failed job instead of a silent green one.
        if: always()
        run: |
          if [ "${{ steps.openvsx.outcome }}" != "success" ] || [ "${{ steps.marketplace.outcome }}" != "success" ]; then
            echo "Open VSX: ${{ steps.openvsx.outcome }}" >&2
            echo "Marketplace: ${{ steps.marketplace.outcome }}" >&2
            exit 1
          fi
