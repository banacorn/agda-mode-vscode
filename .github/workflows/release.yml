name: Release

# Two ways in:
#   1. A push to master that changes package.json's version - tags it, then deploys.
#   2. A push of a v* tag (e.g. pushed by hand) - deploys directly, tagging skipped
#      since the tag already exists. This is also the escape hatch for re-running
#      a deploy without touching package.json again.
#
# Both paths converge on one job so the tag push never has to trigger a second
# workflow run - avoiding the GITHUB_TOKEN anti-recursion restriction that a
# separate tag-triggered workflow would hit.

on:
  push:
    branches: [ master ]
    tags: [ 'v*' ]
    paths:
      - 'package.json'

# Serialize releases: an overlapping master push and manual tag push (or two
# close master pushes) must not publish concurrently. Never cancel an
# in-progress release - it may have already tagged or partially published.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  tag:
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    outputs:
      should_deploy: ${{ steps.decide.outputs.should_deploy }}
    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: 🔍 Check whether the version changed, and tag it if so
        id: decide
        run: |
          CURRENT=$(node -p "require('./package.json').version")
          git show ${{ github.event.before }}:package.json > /tmp/previous-package.json
          PREVIOUS=$(node -p "require('/tmp/previous-package.json').version")
          if [ "$CURRENT" = "$PREVIOUS" ]; then
            echo "should_deploy=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          SEMVER_REGEX='^[0-9]+\.[0-9]+\.[0-9]+$'
          if ! [[ "$CURRENT" =~ $SEMVER_REGEX ]]; then
            echo "package.json version '$CURRENT' is not a valid X.Y.Z semver" >&2
            exit 1
          fi
          if ! [[ "$PREVIOUS" =~ $SEMVER_REGEX ]]; then
            echo "previous package.json version '$PREVIOUS' is not a valid X.Y.Z semver, cannot compare" >&2
            exit 1
          fi
          node -e "
            const [c, p] = process.argv.slice(1).map(v => v.split('.').map(Number));
            for (let i = 0; i < 3; i++) {
              if (c[i] > p[i]) process.exit(0);
              if (c[i] < p[i]) process.exit(1);
            }
            process.exit(1);
          " "$CURRENT" "$PREVIOUS" || { echo "package.json version went from $PREVIOUS to $CURRENT, which is not an increase" >&2; exit 1; }

          TAG="v$CURRENT"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          EXISTING=$(git ls-remote origin "refs/tags/$TAG" | cut -f1)
          if [ -n "$EXISTING" ]; then
            if [ "$EXISTING" = "$(git rev-parse HEAD)" ]; then
              echo "Tag $TAG already points at this commit, treating as a retry"
            else
              echo "Tag $TAG already exists and points at a different commit ($EXISTING)" >&2
              exit 1
            fi
          else
            git tag "$TAG"
            git push origin "$TAG"
          fi
          echo "should_deploy=true" >> "$GITHUB_OUTPUT"

  deploy:
    needs: tag
    if: >-
      !cancelled() &&
      (github.ref_type == 'tag' ||
       (needs.tag.result == 'success' && needs.tag.outputs.should_deploy == 'true'))
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v6

      - name: 🔍 Validate the pushed tag matches package.json's version
        if: github.ref_type == 'tag'
        run: |
          VERSION=$(node -p "require('./package.json').version")
          if [ "${GITHUB_REF_NAME}" != "v$VERSION" ]; then
            echo "Tag ${GITHUB_REF_NAME} does not match package.json version $VERSION" >&2
            exit 1
          fi

      - name: 🛠️ Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 20.x

      - name: 📦 Install dependencies
        run: npm ci

      - name: 🔨 Build stuff
        run: npm run dry-run-publish

      - name: 🚀 Publish to Open VSX Registry
        id: openvsx
        uses: HaaLeo/publish-vscode-extension@f4ece70f329f66686bd71c54b1671353fe320e49 # v1
        with:
          pat: ${{ secrets.OPEN_VSX }}
        continue-on-error: true

      - name: Extract version info
        id: version
        run: |
          VERSION=$(node -p "require('./package.json').version")
          MINOR_VERSION=$(echo $VERSION | cut -d. -f2)
          IS_PRERELEASE=$((MINOR_VERSION % 2))
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "minor=$MINOR_VERSION" >> $GITHUB_OUTPUT
          echo "is_prerelease=$IS_PRERELEASE" >> $GITHUB_OUTPUT
          echo "Publishing version $VERSION (minor: $MINOR_VERSION, prerelease: $IS_PRERELEASE)"

      - name: 🚀 Publish to Visual Studio Marketplace
        uses: HaaLeo/publish-vscode-extension@f4ece70f329f66686bd71c54b1671353fe320e49 # v1
        with:
          pat: ${{ secrets.VSCE_PAT }}
          registryUrl: https://marketplace.visualstudio.com
          preRelease: ${{ steps.version.outputs.is_prerelease == '1' }}
          # Reuse the exact vsix Open VSX just published instead of repackaging,
          # so both registries ship the same artifact. Falls back to repackaging
          # if the Open VSX step failed before producing one.
          extensionFile: ${{ steps.openvsx.outcome == 'success' && steps.openvsx.outputs.vsixPath || '' }}
